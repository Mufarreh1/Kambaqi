<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كم باقي؟</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#141030;
  --bg2:#1f1a45;
  --card:#1e1945;
  --ink:#f0eaff;
  --ink2:#c4b5fd;
  --accent:#a78bfa;
}

{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--ink);
  max-width:480px;
  margin:auto;
}

/ HEADER /
.hdr{
  text-align:center;
  padding:30px;
  background:linear-gradient(135deg,#1a0f3e,#4c1d95);
}
.hdr h1{
  font-size:2.4rem;
  font-weight:900;
}
.hdr p{
  opacity:.8;
  font-size:.9rem;
}

/ FILTER /
.flt{
  display:flex;
  gap:6px;
  padding:10px;
  flex-wrap:wrap;
  justify-content:center;
}
.fb{
  padding:8px 16px;
  border-radius:30px;
  border:1px solid #333;
  background:none;
  color:#bbb;
  cursor:pointer;
}
.fb.on{
  background:var(--accent);
  color:#fff;
  border:none;
}

/ GRID /
.grd{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/ CARD /
.cd{
  background:var(--card);
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.cd h2{
  font-size:1.4rem;
  margin-bottom:6px;
}
.cd p{
  font-size:.85rem;
  color:var(--ink2);
  margin-bottom:12px;
}

/ COUNTDOWN /
.ct{
  display:flex;
  justify-content:center;
  gap:6px;
  direction:ltr;
}
.cu{
  background:#0003;
  padding:10px;
  border-radius:10px;
  min-width:55px;
}
.cn{
  font-size:1.5rem;
  font-weight:900;
}
.cl{
  font-size:.7rem;
  opacity:.7;
}

/ BUTTON /
.share{
  margin-top:12px;
  background:var(--accent);
  border:none;
  padding:8px 18px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}

</style>
</head>

<body>

<header class="hdr">
  <h1>كم باقي؟</h1>
  <p>العد التنازلي للمناسبات</p>
</header>

<nav class="flt">
  <button class="fb on" data-f="all">الكل</button>
  <button class="fb" data-f="دينية">دينية</button>
  <button class="fb" data-f="وطنية">وطنية</button>
  <button class="fb" data-f="مالية">مالية</button>
</nav>

<main class="grd" id="app"></main>

<script>

const EVENTS=[
{title:'رمضان 1448',date:'2027-02-08',cat:'دينية'},
{title:'عيد الفطر',date:'2026-03-20',cat:'دينية'},
{title:'عيد الأضحى',date:'2026-05-27',cat:'دينية'},
{title:'اليوم الوطني',date:'2026-09-23',cat:'وطنية'},
{title:'راتب الشهر',date:'2026-05-27',cat:'مالية'}
];

function diff(d){
  const now=new Date();
  const t=new Date(d);
  const ms=t-now;
  if(ms<=0) return null;

  return{
    d:Math.floor(ms/86400000),
    h:Math.floor(ms%86400000/3600000),
    m:Math.floor(ms%3600000/60000),
    s:Math.floor(ms%60000/1000)
  }
}

function render(){
  const app=document.getElementById('app');

  app.innerHTML=EVENTS.map(e=>  <div class="cd" data-cat="${e.cat}">     <h2>${e.title}</h2>     <p>${e.date}</p>      <div class="ct" data-date="${e.date}">       <div class="cu"><div class="cn" data-d>--</div><div class="cl">يوم</div></div>       <div class="cu"><div class="cn" data-h>--</div><div class="cl">ساعة</div></div>       <div class="cu"><div class="cn" data-m>--</div><div class="cl">دقيقة</div></div>       <div class="cu"><div class="cn" data-s>--</div><div class="cl">ثانية</div></div>     </div>      <button class="share" onclick="shareEvent('${e.title}','${e.date}')">مشاركة</button>    </div>  ).join('');
}

function update(){
  document.querySelectorAll('.ct').forEach(el=>{
    const d=diff(el.dataset.date);
    if(!d) return;

    el.querySelector('[data-d]').textContent=d.d;
    el.querySelector('[data-h]').textContent=d.h;
    el.querySelector('[data-m]').textContent=d.m;
    el.querySelector('[data-s]').textContent=d.s;
  });
}

function shareEvent(title,date){
  const text=كم باقي على ${title}؟\n${date};

  if(navigator.share){
    navigator.share({title,text});
  }else{
    navigator.clipboard.writeText(text);
    alert('تم النسخ');
  }
}

/ FILTER */
document.querySelectorAll('.fb').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');

    const f=btn.dataset.f;

    document.querySelectorAll('.cd').forEach(c=>{
      c.style.display=(f==='all'||c.dataset.cat===f)?'':'none';
    });
  };
});

render();
update();
setInterval(update,1000);

</script>

</body>
</html>
